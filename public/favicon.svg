<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D282E" />
      <stop offset="100%" stop-color="#19161B" />
    </linearGradient>
    <linearGradient id="favAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A63A50" />
      <stop offset="50%" stop-color="#8B5E83" />
      <stop offset="100%" stop-color="#E8B7C8" />
    </linearGradient>
  </defs>

  <!-- Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#favBgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#8B5E83" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Stylized 'AF' Monogram -->
  <g transform="translate(6, 6)">
    <!-- Left diagonal leg of A -->
    <polygon points="21,6 30,6 11,46 2,46" fill="#FFFFFF" />
    <!-- Top arch/apex join -->
    <polygon points="21,6 48,6 44,14 28,14" fill="#FFFFFF" />
    <!-- Right vertical of F -->
    <polygon points="42,6 50,6 42,46 34,46" fill="#FFFFFF" opacity="0.9" />
    
    <!-- Accent F-Bars in Website Rose-Berry Accent Color -->
    <!-- Top accent bar of F -->
    <rect x="23" y="7" width="26" height="7" rx="1.5" fill="url(#favAccentGrad)" />
    <!-- Middle accent bar of F -->
    <polygon points="17,23 44,23 40,30 14,30" fill="url(#favAccentGrad)" />

    <!-- Center Dot from 'O' Accent -->
    <circle cx="28" cy="38" r="4" fill="url(#favAccentGrad)" />
    <circle cx="27" cy="37" r="1.5" fill="#FFF9FA" />
  </g>
</svg>