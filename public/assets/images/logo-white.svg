<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="340" height="64">
  <defs>
    <!-- Brand Primary Gradient for Accents -->
    <linearGradient id="afhBrandGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B7C8" />
      <stop offset="50%" stop-color="#D48BAA" />
      <stop offset="100%" stop-color="#B8658D" />
    </linearGradient>

    <linearGradient id="afhLetterWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDE8EC" />
    </linearGradient>
  </defs>

  <!-- Wordmark Container -->
  <g transform="translate(6, 7)">
    
    <!-- === LETTER 'A' with 'F' combined bars === -->
    <polygon points="22,2 34,2 12,46 0,46" fill="url(#afhLetterWhite)" />
    <polygon points="22,2 62,2 57,11 31,11" fill="url(#afhLetterWhite)" />
    <polygon points="53,2 64,2 53,46 42,46" fill="url(#afhLetterWhite)" opacity="0.95" />
    
    <!-- Accent F-Bars in Website Brand Primary Color -->
    <rect x="25" y="4" width="36" height="8" rx="1.5" fill="url(#afhBrandGradWhite)" />
    <rect x="27" y="4.5" width="32" height="1.8" fill="#FFFFFF" opacity="0.9" />
    <polygon points="17,23 54,23 50,30 13,30" fill="url(#afhBrandGradWhite)" />
    <polygon points="18,23.5 52,23.5 49,25.5 15,25.5" fill="#FFFFFF" opacity="0.8" />

    <!-- === LETTER 'O' with Center Dot === -->
    <circle cx="92" cy="24" r="22" fill="url(#afhLetterWhite)" />
    <circle cx="92" cy="24" r="13" fill="#1C181E" />
    <circle cx="92" cy="24" r="5.5" fill="url(#afhBrandGradWhite)" />
    <circle cx="90.5" cy="22.5" r="1.8" fill="#FFFFFF" opacity="0.9" />

    <!-- === LETTER 'R' === -->
    <path d="M 124 2 L 148 2 C 158 2 164 7 164 17 C 164 24 159 28 151 30 L 165 46 L 152 46 L 138 31 L 135 31 L 135 46 L 124 46 Z M 135 12 L 135 22 L 146 22 C 151 22 153 19 153 17 C 153 14 151 12 146 12 Z" fill="url(#afhLetterWhite)" />

    <!-- === LETTER 'E' === -->
    <polygon points="174,2 206,2 206,12 185,12 185,19 203,19 203,28 185,28 185,36 207,36 207,46 174,46" fill="url(#afhLetterWhite)" />

    <!-- Divider Pill -->
    <circle cx="219" cy="24" r="2.5" fill="url(#afhBrandGradWhite)" />

    <!-- "HEALTH" in clean white -->
    <text x="228" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="16" letter-spacing="2" fill="#E8B7C8">HEALTH</text>
  </g>
</svg>